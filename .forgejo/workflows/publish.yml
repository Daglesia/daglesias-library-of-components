name: Publish npm package

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish
    runs-on: docker
    container:
      image: node:22
    env:
      REGISTRY_HOST: git.daglesia.com
      REGISTRY_PATH: /api/packages/magdalena/npm/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version from git tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build

      - name: Authenticate to Forgejo registry
        env:
          TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: echo "//${REGISTRY_HOST}${REGISTRY_PATH}:_authToken=${TOKEN}" > ~/.npmrc

      - name: Publish
        run: npm publish